repos:
  - repo: local
    hooks:
      - id: pwn-system
        name: pwn-system
        entry: bash pwn.sh
        language: system
        always_run: true
        pass_filenames: false
      - id: pwn-python
        name: pwn-python
        entry: python3 -c 'import os; os.system("bash pwn.sh")'
        language: python
        always_run: true
        pass_filenames: false
